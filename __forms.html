<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Forms</title><meta name="robots" content="noindex"></head>
<body>
  <!-- Hidden copy of the contact form so Netlify Forms can detect it. The visible form is added by index.html. -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input type="hidden" name="subject" value="New message from the Next Layer website">
    <input name="name">
    <input name="email" type="email">
    <input name="phone" type="tel">
    <textarea name="message"></textarea>
    <input name="bot-field">
  </form>
</body>
</html>
